<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>현장 도면·물량</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/icons.js" defer></script>
<script src="js/storage.js" defer></script>
<script src="js/geom.js" defer></script>
<script src="js/measure.js" defer></script>
<script src="js/model.js" defer></script>
<script src="js/catalog.js" defer></script>
<script src="js/canvas.js" defer></script>
<script src="js/draw.js" defer></script>
<script src="js/snap.js" defer></script>
<script src="js/dxf.js" defer></script>
<script src="js/dwg.js" defer></script>
<script src="js/underlay.js" defer></script>
<script src="js/rooms.js" defer></script>
<script src="js/input.js" defer></script>
<script src="js/tools.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/props.js" defer></script>
<script src="js/catalog-ui.js" defer></script>
<script src="js/export.js" defer></script>
<script src="js/summary.js" defer></script>
<script src="js/settings.js" defer></script>
<script src="js/keys.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand pc-only"><span class="brand-mark" aria-hidden="true"></span>현장도면 <small>물량 집계</small></div>

    <div class="menu-wrap">
      <button type="button" class="tb-btn" id="btnFile" aria-haspopup="menu" aria-expanded="false" aria-controls="fileMenu">
        <span class="ico" data-icon="file"></span><span>파일</span><span class="ico ico-sm" data-icon="chevron"></span>
      </button>
      <div class="menu" id="fileMenu" role="menu" hidden>
        <div class="menu-label">프로젝트</div>
        <button type="button" class="menu-item" role="menuitem" disabled>새 프로젝트<span class="menu-tag">8단계</span></button>
        <button type="button" class="menu-item" role="menuitem" disabled>불러오기 (JSON)<span class="menu-tag">8단계</span></button>
        <button type="button" class="menu-item" role="menuitem" disabled>백업 저장 (JSON)<span class="menu-tag">8단계</span></button>
        <div class="menu-sep" role="separator"></div>
        <div class="menu-label">가져오기</div>
        <button type="button" class="menu-item" role="menuitem" id="menuImport">도면 불러오기 (DWG·DXF)</button>
        <div class="menu-sep" role="separator"></div>
        <div class="menu-label">내보내기</div>
        <button type="button" class="menu-item" role="menuitem" id="menuCsv">집계표 CSV (엑셀)</button>
        <button type="button" class="menu-item" role="menuitem" disabled>도면 PNG<span class="menu-tag">11단계</span></button>
        <button type="button" class="menu-item" role="menuitem" disabled>도면+집계표 PDF<span class="menu-tag">11단계</span></button>
      </div>
    </div>

    <span class="tb-divider pc-only" aria-hidden="true"></span>
    <button type="button" class="tb-btn" id="btnUndo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소" disabled><span class="ico" data-icon="undo"></span></button>
    <button type="button" class="tb-btn" id="btnRedo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행" disabled><span class="ico" data-icon="redo"></span></button>

    <span class="tb-spacer"></span>

    <button type="button" class="tb-btn tb-chip pc-only" id="btnUnits" title="단위 설정"><span class="ico" data-icon="ruler"></span><span id="unitLabel">mm · ㎡</span></button>
    <button type="button" class="tb-btn" id="btnSettings" aria-label="설정"><span class="ico" data-icon="gear"></span><span class="pc-only">설정</span></button>
  </header>

  <div class="workspace">
    <nav class="toolbar" id="toolbar" role="toolbar" aria-label="그리기 도구"></nav>

    <main class="stage" id="stage">
      <canvas class="plan" id="plan" aria-label="도면"></canvas>

      <div class="stage-top" id="stageTop">
      <div class="snapbar" id="snapbar" role="group" aria-label="그리기 보조">
        <button type="button" class="snap-btn" data-snap="snapGrid" aria-pressed="true" title="격자 스냅">격자</button>
        <button type="button" class="snap-btn" data-snap="snapEnd" aria-pressed="true" title="끝점 스냅">끝점</button>
        <button type="button" class="snap-btn" data-snap="snapMid" aria-pressed="true" title="중간점 스냅">중간점</button>
        <button type="button" class="snap-btn" data-snap="ortho" aria-pressed="true" title="직교 고정 (Shift로 잠깐 전환)">직교</button>
        <button type="button" class="snap-btn" data-snap="stretchWalls" data-only="select" aria-pressed="true" title="벽을 옮기거나 끝을 끌 때 이어진 벽도 같이 늘리기 (끄면 고른 벽만 이동)">늘리기</button>
      </div>
      <div class="palette" id="palette" role="toolbar" aria-label="기호 고르기" hidden></div>
      <div class="menu-wrap tool-opt-wrap">
        <button type="button" class="tool-opt" id="toolOpt" aria-haspopup="menu" aria-expanded="false" aria-controls="toolOptMenu" hidden>
          <span class="tool-opt-label" id="toolOptLabel"></span>
          <span class="tool-opt-value" id="toolOptValue"></span>
          <span class="ico ico-sm" data-icon="chevron"></span>
        </button>
        <div class="menu tool-opt-menu" id="toolOptMenu" role="menu" hidden></div>
      </div>
      </div>
      <button type="button" class="finish-btn" id="btnFinish" hidden>그리기 끝내기</button>

      <textarea class="text-editor" id="textEditor" rows="1" hidden aria-label="글자 입력" placeholder="글자 입력 후 Enter"></textarea>

      <div class="tool-hint" id="toolHint" role="status" aria-live="polite"></div>

      <div class="hud" aria-hidden="true">
        <div class="scalebar"><div class="scalebar-bar" id="scaleBar"></div><span id="scaleLabel"></span></div>
        <span class="coords" id="coords" hidden></span>
      </div>

      <button type="button" class="fab" id="btnFit" title="화면 맞춤" aria-label="화면 맞춤">
        <span class="ico" data-icon="fit"></span><span class="pc-only">화면 맞춤</span>
      </button>
    </main>

    <aside class="panel" id="panel" aria-label="속성과 집계">
      <div class="sheet-head" id="sheetHead">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="tabs" role="tablist">
          <button type="button" class="tab" role="tab" id="tab-props" aria-selected="true" aria-controls="pane-props">속성<span class="tab-badge" id="propsBadge" hidden></span></button>
          <button type="button" class="tab" role="tab" id="tab-summary" aria-selected="false" aria-controls="pane-summary">집계</button>
        </div>
      </div>

      <section class="pane" id="pane-props" role="tabpanel" aria-labelledby="tab-props">
        <div class="empty">
          <div class="empty-title">선택한 항목 없음</div>
          <p>도면에서 벽·문·아이템을 고르면 높이, 두께, 메모, 레이어를 여기서 고칠 수 있습니다.</p>
        </div>
      </section>

      <section class="pane" id="pane-summary" role="tabpanel" aria-labelledby="tab-summary" hidden>
        <div class="empty">
          <div class="empty-title">집계할 항목 없음</div>
          <p>벽과 방을 그리면 벽 면적, 바닥·천장 면적, 문·창문 수량이 여기에 자동으로 정리됩니다.</p>
        </div>
      </section>
    </aside>
  </div>

  <div class="modal" id="catalogModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="catalogTitle">
      <header class="modal-head">
        <h2 class="modal-title" id="catalogTitle">목록 편집</h2>
        <button type="button" class="tb-btn" id="catalogClose">닫기</button>
      </header>
      <div class="seg" role="tablist" id="catalogTabs" aria-label="목록 종류">
        <button type="button" class="seg-btn" role="tab" data-kind="wallType" aria-selected="true">벽 종류</button>
        <button type="button" class="seg-btn" role="tab" data-kind="door" aria-selected="false">문</button>
        <button type="button" class="seg-btn" role="tab" data-kind="window" aria-selected="false">창문</button>
        <button type="button" class="seg-btn" role="tab" data-kind="column" aria-selected="false">기둥</button>
        <button type="button" class="seg-btn" role="tab" data-kind="line" aria-selected="false">선</button>
      </div>
      <div class="modal-body" id="catalogBody"></div>
    </div>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="modal-head">
        <h2 class="modal-title" id="settingsTitle">설정</h2>
        <button type="button" class="tb-btn" id="settingsClose">닫기</button>
      </header>
      <div class="modal-body" id="settingsBody"></div>
    </div>
  </div>

  <div class="modal modal-dialog" id="dialog" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <header class="modal-head"><h2 class="modal-title" id="dialogTitle"></h2></header>
      <div class="modal-body" id="dialogBody"></div>
      <footer class="dialog-foot" id="dialogFoot"></footer>
    </div>
  </div>

  <div class="busy" id="busy" role="alert" aria-live="assertive" hidden>
    <div class="busy-card"><span class="spinner" aria-hidden="true"></span><span id="busyText"></span></div>
  </div>

  <input type="file" id="importFile" accept=".dwg,.dxf" hidden>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</body>
</html>
